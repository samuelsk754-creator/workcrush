<script>
const size = 8;
const types = 6;
let board = [];
let selected = null;
let busy = false;

const boardEl = document.getElementById("board");

function rand() {
  return Math.floor(Math.random() * types);
}

function createBoard() {
  board = [];
  for (let r = 0; r < size; r++) {
    board[r] = [];
    for (let c = 0; c < size; c++) {
      board[r][c] = rand();
    }
  }
  draw();
}

function draw() {
  boardEl.innerHTML = "";

  // FORÇA O GRID AQUI (corrige o bug)
  boardEl.style.display = "grid";
  boardEl.style.gridTemplateColumns = "repeat(8, 1fr)";
  boardEl.style.gridTemplateRows = "repeat(8, 1fr)";
  boardEl.style.gap = "8px";

  for (let r = 0; r < size; r++) {
    for (let c = 0; c < size; c++) {
      const cell = document.createElement("div");
      cell.className = "cell t" + board[r][c];
      cell.dataset.r = r;
      cell.dataset.c = c;

      // garante que a célula ocupe a posição correta do grid
      cell.style.width = "100%";
      cell.style.height = "100%";

      cell.onclick = () => select(r, c);
      boardEl.appendChild(cell);
    }
  }
}

function select(r, c) {
  if (busy) return;

  if (!selected) {
    selected = { r, c };
    return;
  }

  const dr = Math.abs(selected.r - r);
  const dc = Math.abs(selected.c - c);

  if ((dr + dc) === 1) {
    swap(selected, { r, c });
  }

  selected = null;
}

function swap(a, b) {
  let temp = board[a.r][a.c];
  board[a.r][a.c] = board[b.r][b.c];
  board[b.r][b.c] = temp;

  draw();

  if (checkMatches().length === 0) {
    setTimeout(() => {
      // desfaz se não formou combinação
      let t = board[a.r][a.c];
      board[a.r][a.c] = board[b.r][b.c];
      board[b.r][b.c] = t;
      draw();
    }, 200);
  } else {
    processMatches();
  }
}

function checkMatches() {
  let matches = [];

  // horizontal
  for (let r = 0; r < size; r++) {
    let count = 1;
    for (let c = 1; c < size; c++) {
      if (board[r][c] === board[r][c - 1]) {
        count++;
      } else {
        if (count >= 3) {
          for (let k = 0; k < count; k++)
            matches.push([r, c - 1 - k]);
        }
        count = 1;
      }
    }
    if (count >= 3) {
      for (let k = 0; k < count; k++)
        matches.push([r, size - 1 - k]);
    }
  }

  // vertical
  for (let c = 0; c < size; c++) {
    let count = 1;
    for (let r = 1; r < size; r++) {
      if (board[r][c] === board[r - 1][c]) {
        count++;
      } else {
        if (count >= 3) {
          for (let k = 0; k < count; k++)
            matches.push([r - 1 - k, c]);
        }
        count = 1;
      }
    }
    if (count >= 3) {
      for (let k = 0; k < count; k++)
        matches.push([size - 1 - k, c]);
    }
  }

  return matches;
}

function processMatches() {
  busy = true;
  let matches = checkMatches();

  if (matches.length === 0) {
    busy = false;
    return;
  }

  matches.forEach(([r, c]) => {
    board[r][c] = null;
  });

  draw();

  setTimeout(dropPieces, 250);
}

function dropPieces() {
  for (let c = 0; c < size; c++) {
    let empty = 0;

    for (let r = size - 1; r >= 0; r--) {
      if (board[r][c] === null) {
        empty++;
      } else if (empty > 0) {
        board[r + empty][c] = board[r][c];
        board[r][c] = null;
      }
    }

    for (let r = 0; r < empty; r++) {
      board[r][c] = rand();
    }
  }

  draw();

  setTimeout(() => {
    if (checkMatches().length > 0) {
      processMatches();
    } else {
      busy = false;
    }
  }, 250);
}

createBoard();
</script>
